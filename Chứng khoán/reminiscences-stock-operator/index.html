      cursor: pointer;
      transition: all 0.3s;

    const SLIDES = [{"id": "slide-01", "layout": "hero", "html": "<div class=\"w-full h-full flex flex-col items-center justify-center relative overflow-hidden\" style=\"background: #0f1419;\">\n  \n  <div class=\"absolute top-0 left-0 right-0 h-3\" style=\"background: #c9a84c;\"></div>\n  <div class=\"absolute left-0 top-0 bottom-0 w-10\" style=\"background: linear-gradient(180deg, #c9a84c, transparent); opacity: 0.16;\"></div>\n  \n  <div class=\"relative z-10 text-center px-24 max-w-6xl\">\n    \n    <div class=\"mb-6\">\n      <span class=\"inline-block px-5 py-2 rounded-full text-sm font-semibold tracking-wider uppercase\" style=\"background: #c9a84c18; color: #c9a84c; letter-spacing: 0.15em;\">\n        Báo cáo\n      </span>\n    </div>\n    \n    <h1 class=\"font-display font-black tracking-tight mb-8\" style=\"font-size: 78px; line-height: 1.04; color: #e8e2d6;\">\n      Reminiscences of a Stock Operator\n    </h1>\n    \n    <p class=\"font-light tracking-wide\" style=\"font-size: 30px; color: #8b95a5; line-height: 1.4;\">\n      Edwin Lefèvre, 1923 — Hồi tưởng của một nhân viên chứng khoán. Chuyện giả tưởng về Jesse Livermore, trader vĩ đại nhất đầu thế kỷ 20\n    </p>\n    \n  </div>\n  \n  \n  <div class=\"absolute bottom-20 left-0 right-0 text-center z-10\">\n    <div class=\"inline-flex items-center gap-3 px-8 py-4 rounded-2xl\" style=\"background: #c9a84c12; backdrop-filter: blur(8px); border: 1px solid #c9a84c22;\">\n      <div style=\"width: 8px; height: 8px; border-radius: 50%; background: #c9a84c;\"></div>\n      <p class=\"font-medium\" style=\"font-size: 18px; color: #8b95a5;\">Cuốn sách kinh điển về nghệ thuật đầu cơ — từ bucket shops đến Wall Street, từ thắng lợi đến phá sản, từ trí tuệ đến bi kịch.</p>\n    </div>\n  </div>\n  \n  \n  <div class=\"absolute bottom-6 left-0 right-0 text-center z-10\">\n    <p style=\"font-size: 12px; color: #8b95a566;\">GEN Report Generator</p>\n  </div>\n</div>", "chart": null, "motion": {"transition": "scale", "reveal": "sequence", "intensity": "polished", "effects": ["accent-sweep"], "order": 0}}, {"id": "slide-02", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0f1419;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #c9a84c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #c9a84c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #c9a84c;\">PHÂN TÍCH</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-14\" style=\"font-size: 48px; line-height: 1.15; color: #e8e2d6;\">\n    24 Chương, 348 Trang — Một Cuộc Đời Qua Lời Kể\n  </h2>\n  <div class=\"flex-1 flex flex-col justify-center\">\n    <ul class=\"space-y-7\">\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Ch I-II: Tuổi thơ Boston, bucket shops, Boy Plunger — học đọc tape từ 14 tuổi\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Ch III-V: Lên New York, thất bại, học lại game thật — tape reading tiến hóa\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Ch VI-VIII: 1906 — trực giác động đất, tips Saratoga, bài học độc lập\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Ch IX-XI: Panic 1907, Anaconda, J.P. Morgan xin dừng bán\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Ch XII-XIV: Percy Thomas, cotton, phá sản, Williamson, bốn năm gầy\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Ch XV-XVIII: Triết lý — the unexpected, tips, hunches, history repeats\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Ch XIX-XXIV: Manipulation, stock pools, Imperial Steel, Consolidated Stove, wisdom cuối\n        </span>\n      </li>\n      \n    </ul>\n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #c9a84c0D, #c9a84c08); border: 1px solid #c9a84c1A;\">\n    <div class=\"fl ading Trường Tồn\n    </h2>\n    \n    \n    <p class=\"mt-10 max-w-4xl\" style=\"font-size: 30px; line-height: 1.45; color: #8b95a5;\">24 chương, 40 năm kinh nghiệm — những nguyên tắc còn nguyên giá trị</p>\n    \n    \n  </div>\n  \n  <div class=\"relative z-10 max-w-6xl px-8 py-6\" style=\"background: linear-gradient(135deg, #c9a84c10, #c9a84c05); border-left: 8px solid #c9a84c; border-radius: 0 14px 14px 0;\">\n    <p class=\"font-semibold\" style=\"font-size: 30px; line-height: 1.32; color: #e8e2d6dd;\">Từ bucket shops đến Wall Street, từ 1901 đến 1923 — Livermore tổng hợp những bài học sinh từ hàng nghìn trade.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "sequence", "intensity": "polished", "effects": ["accent-sweep"], "order": 42}}, {"id": "slide-44", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0f1419;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #c9a84c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #c9a84c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #c9a84c;\">PHÂN TÍCH</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-14\" style=\"font-size: 48px; line-height: 1.15; color: #e8e2d6;\">\n    Market Timing — Đọc Tape, Hiểu Điều Kiện\n  </h2>\n  <div class=\"flex-1 flex flex-col justify-center\">\n    <ul class=\"space-y-7\">\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #c9a84c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #e8e2d6cc;\">\n          Đọc tape là nền tảng — nhưng không đủ, phải nhìn xa hơn fluctuation ngày\n n again'\n        </span>\n      </li>\n      \n    </ul>\n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #c9a84c0D, #c9a84c08); border: 1px solid #c9a84c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #c9a84c1A;\">\n      <span style=\"color: #c9a84c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #c9a84c;\">Livermore phát triển từ pure tape reader thành investor có kiến thức tổng quát — mỗi bước là một nhận thức từ thất bại.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "rise", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 43}}, {"id": "slide-45", "layout": "table", "html": "<div class=\"w-full h-full flex flex-col px-24 py-16 relative\" style=\"background: #0f1419;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #c9a84c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #c9a84c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #c9a84c;\">BẢNG SỐ LIỆU</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-8\" style=\"font-size: 42px; line-height: 1.15; color: #e8e2d6;\">\n    Money Management — Bảo Vốn Trên Tất Cả\n  </h2>\n  <div class=\"flex-1 overflow-auto\">\n    <table class=\"w-full\" style=\"border-collapse: separate; border-spacing: 0; font-size: 20px;\">\n      <thead>\n        <tr>\n          \n          <th class=\"px-6 py-4 text-left font-semibold\" style=\"background: #c9a84c; color: white; border-radius: 12px 0 0 0;\">\n            Nguyên tắc\n          </th>\n          \n          <th class=\"px-6 py-4 text-left font-semibold\" style=\"background: #c9a84c; color: white; \">\n            Chi tiết\n          </th>\n          \n          <th class=\"px-6 py-4 text-left font-semibold\" style=\"background: #c9a84c; color: white; border-radius: 0 12px 0 0;\">\n            Nguồn\n          </th>\n          \n        </tr>\n      </thead>\n      <tbody>\n        \n        <tr class=\"transition-colors\" style=\"background: #e8e2d605;\">\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Cut losses nhanh\n          </td>\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Stock không act right — bán ngay, không hỏi tại sao\n          </td>\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Ch IX, Anaconda trade\n          </td>\n          \n        </tr>\n        \n        <tr class=\"transition-colors\" style=\"\">\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Let profits run\n          </td>\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Big money is in the sitting, not the thinking\n          </td>\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Ch V-VII\n          </td>\n          \n        </tr>\n        \n        <tr class=\"transition-colors\" style=\"background: #e8e2d605;\">\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Giữ cash reserve\n          </td>\n          \n          <td class=\"px-6 py-3.5\" style=\"border-bottom: 1px solid #8b95a518; color: #e8e2d6cc;\">\n            Cash là ammo cho cơ hội lớn tiếp theo\n          </td>\n          \n          <td class=\     const initialParams = new URLSearchParams(window.location.search);

    function motionTargets(deck) {
      return deck.querySelectorAll([
        'h1', 'h2', 'h3',
        'p', 'li', 'table',
        '.chart-container',
        '.grid > *',
        '.space-y-3 > *',
        '.space-y-7 > *',
        '.inline-flex'

    function applyMotion(deck, slide) {
      const motion = slide.motion || {};
      deck.classList.remove(

        'motion-quiet', 'motion-polished', 'motion-cinematic', 'motion-accent-sweep'

      deck.classList.add(`motion-${motion.intensity || 'polished'}`);
      if ((motion.effects || []).includes('accent-sweep') || ['hero', 'section', 'takeaway'].includes(slide.layout)) {
        deck.classList.add('motion-accent-sweep');
      }
      const targets = Array.from(motionTargets(deck)).filter((node) => {
        if (node.classList.contains('absolute')) return false;
        if (node.closest('.absolute')) return false;
        return true;
      });
      targets.forEach((node, idx) => {
        node.classList.add('motion-target');
        node.style.animationDelay = motion.reveal === 'none' ? '0ms' : `${Math.min(idx, 14) * 55}ms`;
      });
    }

    function renderSlide(index) {
      if (window._activeChart) {
        window._activeChart.dispose();
        window._activeChart = null;

      const deck = document.getElementById('deck');
      deck.classList.add('is-changing');
      
      setTimeout(() => {
        deck.innerHTML = SLIDES[index].html;
        deck.dataset.slideIndex = index;
        applyMotion(deck, SLIDES[index]);
        deck.classList.remove('is-changing');
        
        setTimeout(() => {
          const chartDom = deck.querySelector('.chart-container');
          if (chartDom && SLIDES[index].chart) {
            const chart = echarts.init(chartDom);
            chart.setOption(SLIDES[index].chart);
            window._activeChart = chart;
          }
        }, 200);
        
        updateNav(index);
        updateProgress(index);
      }, 250);
    }

    function updateNav(idx) {
      const nav = document.getElementById('slide-nav');
      let dotsHtml = '<div class="dots">';
      SLIDES.forEach((_, i) => {
        dotsHtml += `<div class="dot ${i === idx ? 'active' : ''}" onclick="goTo(${i})"></div>`;

      dotsHtml += '</div>';
      
      nav.innerHTML = `

        ${dotsHtml}

        <button onclick="next()">&#9654;</button>

    }

      document.getElementById('progress').style.width = pct + '%';

      const url = new URL(window.location.href);

    }

    }
    function prev() {

    }
