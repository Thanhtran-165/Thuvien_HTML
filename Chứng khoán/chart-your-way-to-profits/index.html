    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: #111827;
      overflow: hidden;
    }
    
    .slide-container {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }
    
    .font-display {
      font-family: Georgia, 'Times New Roman', serif;
    }
    
    .accent-text { color: #ea580c; }
    .secondary-text { color: #475569; }
    
    .chart-container {
      width: 100%;
      min-height: 400px;
    }

    .slide-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .slide-nav button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .slide-nav button:hover {
      background: rgba(255,255,255,0.15);
    }
    .slide-nav .counter {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      min-width: 60px;
      text-align: center;
    }
    .slide-nav .dots {
      display: flex;
      gap: 6px;
      margin: 0 8px;
    }
    .slide-nav .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.3s;
    }
    .slide-nav .dot.active {
      background: #ea580c;
      width: 24px;
      border-radius: 4px;
    }

    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: #ea580c;
      transition: width 0.4s ease;
      z-index: 10000;
    }

    body.clean .slide-nav,
    body.clean .progress-bar {
      display: none;
    }

    .motion-target {
      will-change: transform, opacity, filter;
      animation-duration: 720ms;
      animation-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
      animation-fill-mode: both;
    }
    .motion-quiet .motion-target { animation-duration: 520ms; }
    .motion-cinematic .motion-target { animation-duration: 940ms; }
    .transition-fade .motion-target { animation-name: fadeIn; }
    .transition-rise .motion-target { animation-name: riseIn; }
    .transition-push .motion-target { animation-name: pushIn; }
    .transition-scale .motion-target { animation-name: scaleIn; }
    .slide-container.is-changing {
      opacity: 0.18;
      filter: blur(6px);
      transition: opacity 220ms ease, filter 220ms ease;
    }
    .motion-accent-sweep::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 0%, #ea580c12 42%, transparent 72%);
      transform: translateX(-120%);
      animation: accentSweep 1100ms cubic-bezier(0.19, 1, 0.22, 1) 90ms both;
    }
    .chart-container {
      animation: chartLift 900ms cubic-bezier(0.19, 1, 0.22, 1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(26px); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes pushIn {
      from { opacity: 0; transform: translateX(34px); filter: blur(4px); }
      to { opacity: 1; transform: translateX(0); filter: blur(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.965); filter: blur(4px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes accentSweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(120%); }
    }
    @keyframes chartLift {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion-target, .chart-container, .motion-accent-sweep::after {
        animation: none !important;
        transition: none !important;
      }
    }

: "rise", "reveal": "sequence", "intensity": "polished", "effects": ["accent-sweep"], "order": 18}}, {"id": "slide-20", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #ffffff;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">PHÂN TÍCH</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-14\" style=\"font-size: 48px; line-height: 1.15; color: #111827;\">\n    RSI va Bollinger Bands: Do Luong Mua/Ban\n  </h2>\n  <div class=\"flex-1 flex flex-col justify-center\">\n    <ul class=\"space-y-7\">\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #111827cc;\">\n          RSI (Relative Strength Index): So sanh do lon tang vs giam gan day, khoang 0-100\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #111827cc;\">\n          Tren 70 = qua mua (ban), Duoi 30 = qua ban (mua) — nhung can tin hieu xac nhan ro rang\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #111827cc;\">\n          Bollinger Bands: 2 do lech chuan tren/duoi SMA — the hien bien dong va vi tri tuong doi cua gia\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #111827cc;\">\n          Gia bam vao band tren = manh; gia bam vao band duoi = yeu; bop bang BB = sap dot pha lon\n        </span>\n      </li>\n      \n      <li class=\"flex items-start gap-5 group\">\n        <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n        <span style=\"font-size: 26px; line-height: 1.55; color: #111827cc;\">\n          PSAR (Parabolic SAR): Dots duoi gia = Bullish, dots tren gia = Bearish, cung cap stop-loss tu dong\n        </span>\n      </li>\n      \n    </ul>\n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #ea580c0D, #ea580c08); border: 1px solid #ea580c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #ea580c1A;\">\n      <span style=\"color: #ea580c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #ea580c;\">RSI va Bollinger Bands la bo doi hoan hao: RSI cho ban biet 'khi nao' (thoi diem), BB cho ban biet 'o dau' (vi tri gia). Ket hop ca hai tang xac suat thanh cong.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 19}}, {"id": "slide-21", "layout": "comparison", "html": "<div class=\"w-full h-full flex flex-col px-24 py-16 relative\" style=\"background: #ffffff;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">SO SÁNH</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-10\" style=\"font-size: 42px; line-height: 1.15; color: #111827;\">\n    Ket Hop Da Chi Bao: Xac Nhan Manh Hon\n  </h2>\n  <div class=\"flex-1 flex gap-8\">\n    <div class=\"flex-1 flex flex-col rounded-2xl px-10 py-8 overflow-auto\" style=\"background: linear-gradient(180deg, #ea580c08, #ea580c03); border: 1.5px solid #ea580c20;\">\n      <div class=\"flex items-center gap-3 mb-6\">\n        <div class=\"flex-shrink-0\" style=\"width: 12px; height: 12px; background: #ea580c; border-radius: 3px;\"></div>\n        <h3 class=\"font-display font-bold\" style=\"font-size: 26px; color: #ea580c;\">Chi bao don le (Yeu)</h3>\n      </div>\n      <ul class=\"space-y-3\" style=\"list-style: none; padding: 0;\">\n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Vi du: Chi RSI tren 70\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Co the la tin hieu gia\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Co the chi la gia manh\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Nhieu tin hieu gia tren co phieu bien dong\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Ket luan: Xac suat thanh cong thap hon\n        </li>\n        \n        \n      </ul>\n    </div>\n    <div class=\"flex-1 flex flex-col rounded-2xl px-10 py-8 overflow-auto\" style=\"background: linear-gradient(180deg, #47556908, #47556903); border: 1.5px solid #47556920;\">\n      <div class=\"flex items-center gap-3 mb-6\">\n        <div class=\"flex-shrink-0\" style=\"width: 12px; height: 12px; background: #475569; border-radius: 3px;\"></div>\n        <h3 class=\"font-display font-bold\" style=\"font-size: 26px; color: #475569;\">Da chi bao phoi hop (Manh)</h3>\n      </div>\n      <ul class=\"space-y-3\" style=\"list-style: none; padding: 0;\">\n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Vi du: RSI tren 70 + MACD phan ky + Gia cat duoi MA 50\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          3 chi bao cung 'bo phieu' ve huong di xuong\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Xac suat thanh cong cao hon nhieu\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Giam thieu tin hieu gia (whipsaw)\n        </li>\n        \n        \n        \n        <li style=\"font-size: 22px; line-height: 1.55; color: #111827bb;\">\n          Ket luan: Tin hieu tin cay hon\n        </li>\n        \n        \n      </ul>\n    </div>\n  </div>\n  \n  <div class=\"mt-6 text-center flex-shrink-0\">\n    <div class=\"inline-flex items-center gap-3 px-8 py-4 rounded-2xl\" style=\"background: #ea580c; color: white;\">\n      <span style=\"font-size: 18px;\">&#9733;</span>\n      <p class=\"font-semibold\" style=\"font-size: 21px;\">Chi bao ky thuat giong nhu cuoc bo phieu: mot chi bao la mot nguoi ung ho, nhieu chi bao cung dong y la mot phong tran.</p>\n    </div>\n  </div>\n  \n</div>", "chart": null,  40px; height: 40px; background: #ea580c; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">2</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #111827dd;\">\n          Mau hinh lap lai qua cac thap ky: H&S, Cup with Handle, Fibonacci, Support/Resistance — hoc tu lich su\n        </span>\n      </div>\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #ea580c08; border: 1px solid #ea580c18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #ea580c; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">3</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #111827dd;\">\n          Ket hop nhieu cong cu (chi bao + duong xu huong + Fibonacci) tang xac suat thanh cong\n        </span>\n      </div>\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #ea580c08; border: 1px solid #ea580c18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #ea580c; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">4</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #111827dd;\">\n          Quan ly rui ro la chía khoa sinh ton: SOB FEES, stop-loss, size nhat quy, ty le rui ro/thuong co loi\n        </span>\n      </div>\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #ea580c08; border: 1px solid #ea580c18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #ea580c; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">5</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #111827dd;\">\n          Giao dich la hanh trinh tu phat hien ca nhan suot doi — khong co he thong hoan hao, khong co Holy Grail\n        </span>\n      </div>\n      \n    </div>\n  </div>\n\n  \n  <div class=\"relative z-10 mt-8 px-8 py-5 flex items-start gap-4\" style=\"background: #ea580c; color: white; border-radius: 14px; box-shadow: 0 14px 35px #ea580c33;\">\n    <span class=\"flex-shrink-0\" style=\"font-size: 24px; line-height: 1.35;\">&#9733;</span>\n    <p class=\"font-bold\" style=\"font-size: 24px; line-height: 1.35;\">Sach khong the day ban cach giao dich chi cach doc bieu do — sach day co khi nang va mau hinh, nhung ban phai tu phat hien phong cach rieng. Chart your way to profits.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "scale", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 71}}];
    const initialParams = new URLSearchParams(window.location.search);
    if (initialParams.get('clean') === '1') document.body.classList.add('clean');
    const initialSlide = Number.parseInt(initialParams.get('slide') || '1', 10);
    let currentIndex = Number.isFinite(initialSlide) ? Math.min(Math.max(initialSlide - 1, 0), SLIDES.length - 1) : 0;

    function motionTargets(deck) {
      return deck.querySelectorAll([
        'h1', 'h2', 'h3',
        'p', 'li', 'table',
        '.chart-container',
        '.grid > *',
        '.space-y-3 > *',
        '.space-y-7 > *',
        '.inline-flex'
      ].join(','));
    }

    function applyMotion(deck, slide) {
      const motion = slide.motion || {};
      deck.classList.remove(
        'transition-fade', 'transition-rise', 'transition-push', 'transition-scale',
        'motion-quiet', 'motion-polished', 'motion-cinematic', 'motion-accent-sweep'
      );
      deck.classList.add(`transition-${motion.transition || 'rise'}`);
      deck.classList.add(`motion-${motion.intensity || 'polished'}`);
      if ((motion.effects || []).includes('accent-sweep') || ['hero', 'section', 'takeaway'].includes(slide.layout)) {
        deck.classList.add('motion-accent-sweep');
      }
      const targets = Array.from(motionTargets(deck)).filter((node) => {
        if (node.classList.contains('absolute')) return false;
        if (node.closest('.absolute')) return false;
        return true;
      });
      targets.forEach((node, idx) => {
        node.classList.add('motion-target');
        node.style.animationDelay = motion.reveal === 'none' ? '0ms' : `${Math.min(idx, 14) * 55}ms`;
      });
    }

    function renderSlide(index) {
      if (window._activeChart) {
        window._activeChart.dispose();
        window._activeChart = null;
      }
      const deck = document.getElementById('deck');
      deck.classList.add('is-changing');
      
      setTimeout(() => {
        deck.innerHTML = SLIDES[index].html;
        deck.dataset.slideIndex = index;
        applyMotion(deck, SLIDES[index]);
        deck.classList.remove('is-changing');
        
        setTimeout(() => {
          const chartDom = deck.querySelector('.chart-container');
          if (chartDom && SLIDES[index].chart) {
            const chart = echarts.init(chartDom);
            chart.setOption(SLIDES[index].chart);
            window._activeChart = chart;
          }
        }, 200);
        
        updateNav(index);
        updateProgress(index);
      }, 250);
    }

    function updateNav(idx) {
      const nav = document.getElementById('slide-nav');
      let dotsHtml = '<div class="dots">';
      SLIDES.forEach((_, i) => {
        dotsHtml += `<div class="dot ${i === idx ? 'active' : ''}" onclick="goTo(${i})"></div>`;
      });
      dotsHtml += '</div>';
      
      nav.innerHTML = `
        <button onclick="prev()">&#9664;</button>
        ${dotsHtml}
        <span class="counter">${idx + 1} / ${SLIDES.length}</span>
        <button onclick="next()">&#9654;</button>
      `;
    }

    function updateProgress(idx) {
      const pct = ((idx + 1) / SLIDES.length) * 100;
      document.getElementById('progress').style.width = pct + '%';
    }

    function syncUrl(index) {
      const url = new URL(window.location.href);
      url.searchParams.set('slide', String(index + 1));
      window.history.replaceState(null, '', url);
    }

    function next() {
      if (currentIndex < SLIDES.length - 1) { currentIndex++; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function prev() {
      if (currentIndex > 0) { currentIndex--; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function goTo(i) {
      currentIndex = Math.min(Math.max(i, 0), SLIDES.length - 1);
      syncUrl(currentIndex);
      renderSlide(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      if (e.key === 'Home') { goTo(0); }
      if (e.key === 'End') { goTo(SLIDES.length - 1); }
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    function scaleDeck() {
      const deck = document.getElementById('deck');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY) * (document.body.classList.contains('clean') ? 0.95 : 0.80);
      deck.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', scaleDeck);
    scaleDeck();
    syncUrl(currentIndex);
    renderSlide(currentIndex);
  </script>
