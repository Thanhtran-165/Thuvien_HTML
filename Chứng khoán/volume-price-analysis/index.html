    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e6edf3;
      overflow: hidden;
    }
    
    .slide-container {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }
    
    .font-display {
      font-family: Georgia, 'Times New Roman', serif;
    }
    
    .accent-text { color: #ea580c; }
    .secondary-text { color: #7d8590; }
    
    .chart-container {
      width: 100%;
      min-height: 400px;
    }

    .slide-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .slide-nav button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .slide-nav button:hover {
      background: rgba(255,255,255,0.15);
    }
    .slide-nav .counter {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      min-width: 60px;
      text-align: center;
    }
    .slide-nav .dots {
      display: flex;
      gap: 6px;
      margin: 0 8px;
    }
    .slide-nav .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.3s;
    }
    .slide-nav .dot.active {
      background: #ea580c;
      width: 24px;
      border-radius: 4px;
    }

    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: #ea580c;
      transition: width 0.4s ease;
      z-index: 10000;
    }

    body.clean .slide-nav,
    body.clean .progress-bar {
      display: none;
    }

    .motion-target {
      will-change: transform, opacity, filter;
      animation-duration: 720ms;
      animation-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
      animation-fill-mode: both;
    }
    .motion-quiet .motion-target { animation-duration: 520ms; }
    .motion-cinematic .motion-target { animation-duration: 940ms; }
    .transition-fade .motion-target { animation-name: fadeIn; }
    .transition-rise .motion-target { animation-name: riseIn; }
    .transition-push .motion-target { animation-name: pushIn; }
    .transition-scale .motion-target { animation-name: scaleIn; }
    .slide-container.is-changing {
      opacity: 0.18;
      filter: blur(6px);
      transition: opacity 220ms ease, filter 220ms ease;
    }
    .motion-accent-sweep::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 0%, #ea580c12 42%, transparent 72%);
      transform: translateX(-120%);
      animation: accentSweep 1100ms cubic-bezier(0.19, 1, 0.22, 1) 90ms both;
    }
    .chart-container {
      animation: chartLift 900ms cubic-bezier(0.19, 1, 0.22, 1) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(26px); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes pushIn {
      from { opacity: 0; transform: translateX(34px); filter: blur(4px); }
      to { opacity: 1; transform: translateX(0); filter: blur(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.965); filter: blur(4px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes accentSweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(120%); }
    }
    @keyframes chartLift {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion-target, .chart-container, .motion-accent-sweep::after {
        animation: none !important;
        transition: none !important;
      }
    }

ion": {"transition": "push", "reveal": "sequence", "intensity": "polished", "effects": ["accent-sweep"], "order": 3}}, {"id": "s05", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0d1117;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">PHÂN TÍCH</span>\n  </div>\n  <div class=\"flex gap-6 flex-1 min-h-0\">\n    <div style=\"flex: 55; display: flex; flex-direction: column; min-height: 0;\">\n      <h2 class=\"font-display font-bold mb-10\" style=\"font-size: 44px; line-height: 1.15; color: #e6edf3;\">\n        Charles Dow - Ông tổ của phân tích kỹ thuật\n      </h2>\n      <div class=\"flex-1 flex flex-col justify-center\">\n        <ul class=\"space-y-6\">\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Charles Dow (1851-1902): Sáng lập Dow Jones Index, Wall Street Journal, và Dow Theory\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Quan niệm cốt lõi: Volume xác nhận xu hướng giá. Giá tăng + volume tăng = di chuyển thật sự\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Ba giai đoạn xu hướng: Tích lũy (insiders mua) -> Public participation -> Phân phối (insiders bán)\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Smart money mua khi public bán, bán khi public mua - tất cả nhìn thấy qua volume\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #ea580c0D, #ea580c08); border: 1px solid #ea580c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #ea580c1A;\">\n      <span style=\"color: #ea580c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #ea580c;\">Dow chưa bao giờ xuất bản công trình - sách 'The ABC of Stock Speculation' (1903) được đồng nghiệp tập hợp sau khi ông mất.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 4}}, {"id": "s06", "layout": "quote", "html": "<div class=\"w-full h-full flex flex-col justify-center px-28 py-20 relative overflow-hidden\" style=\"background: #0d1117;\">\n  <div class=\"max-w-6xl\">\n    <div class=\"font-display font-black mb-8\" style=\"font-size: 120px; line-height: 0.7; color: #ea580c;\">“</div>\n    <h2 class=\"font-display font-bold\" style=\"font-size: 62px; line-height: 1.12; color: #e6edf3;\">\n      Richard Wyckoff - Cha đẻ của VPA hiện đại\n    </h2>\n    \n    \n    <div class=\"mt-14 max-w-4xl border-l-8 pl-7 py-2\" style=\"border-color: #ea580c;\">\n      <p style=\"font-size: 24px; line-height: 1.45; color: #e6edf3cc;\">Wyckoff bắt đầu làm Wall Street tuổi 15 (1888), mở phòng riêng 25 tuổi, và viết khoa học vẫn là blueprint của mọi ngân hàng đầu tư đến nay.</p>\n    </div>\n    \n  </div>\n</div>", "chart": null, "motion": {"transition": "fade", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 5}}, {"id": "s07", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0d1117;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">PHÂN TÍCH</span>\n  </div>\n  <div class=\"flex gap-6 flex-1 min-h-0\">\n    <div style=\"flex: 55; display: flex; flex-direction: column; min-height: 0;\">\n      <h2 class=\"font-display font-bold mb-10\" style=\"font-size: 44px; line-height: 1.15; color: #e6edf3;\">\n        Ba luật cơ bản của Wyckoff - Nền tảng VPA\n      </h2>\n      <div class=\"flex-1 flex flex-col justify-center\">\n        <ul class=\"space-y-6\">\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Luật 1 - Cung và Cầu: Cầu > Cung = giá tăng. Cung > Cầu = giá giảm. Tương tự mua bán hàng ngày\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Luật 2 - Nguyên nhân và Kết quả: Hiệu ứng tỷ lệ thuận với nguyên nhân. Tích lũy lâu = xu hướng mạnh\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Luật 3 - Nỗ lực và Kết quả: Volume (nỗ lực) phải tương đương giá (kết quả). Bất đồng bộ = cảnh báo anomaly\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Mọi phân tích VPA đều tham chiếu qua ba luật này - đặc biệt Luật 3 là công cụ nhận diện nhanh nhất\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #ea580c0D, #ea580c08); border: 1px solid #ea580c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #ea580c1A;\">\n      <span style=\"color: #ea580c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #ea580c;\">Luật 3 là công cụ đơn giản nhất: volume và giá không phù hợp = có điều sai đang xảy ra. Đây là chiếc chìa khóa VPA.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 6}}, {"id": "s08", "layout": "timeline", "html": "<div class=\"w-full h-full flex flex-col px-24 py-16 relative overflow-hidden\" style=\"background: #0d1117;\">\n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">DIỄN TIẾN</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-8\" style=\"font-size: 44px; line-height: 1.12; color: #e6edf3;\">\n    Jesse Livermore và Richard Ney - Hai huyền thoại bổ sung\n  </h2>\n\n  <div class=\"flex-1 flex items-center\">\n    <div class=\"w-full grid grid-cols-2 gap-5\">\n      \n      <div class=\"flex gap-6 items-start rounded-xl px-7 py-6\" style=\"background: #e6edf304; border: 1px solid #ea580c20;\">\n        <div class=\"flex-shrink-0 w-[84px] h-[58px] rounded-xl flex items-center justify-center text-center font-bold\" style=\"background: #ea580c; color: white; font-size: 15px; line-height: 1.1;\">\n          1892\n        </div>\n        <div>\n          <h3 class=\"font-bold\" style=\"font-size: 25px; line-height: 1.25; color: #e6edf3;\">Jesse Livermore bắt đầu</h3>\n          \n          <p class=\"mt-2\" style=\"font-size: 19px; line-height: 1.45; color: #7d8590;\">15 tuổi làm quotation board boy, đọc ticker tape, thấy 'tape đang nói chuyện'</p>\n          \n        </div>\n      </div>\n      \n      <div class=\"flex gap-6 items-start rounded-xl px-7 py-6\" style=\"background: #e6edf304; border: 1px solid #ea580c20;\">\n        <div class=\"flex-shrink-0 w-[84px] h-[58px] rounded-xl flex items-center justify-center text-center font-bold\" style=\"background: #ea580c; color: white; font-size: 15px; line-height: 1.1;\">\n          1907\n        </div>\n        <div>\n          <h3 class=\"font-bold\" style=\"font-size: 25px; line-height: 1.25; color: #e6edf3;\">Livermore short sell</h3>\n          \n          <p class=\"mt-2\" style=\"font-size: 19px; line-height: 1.45; color: #7d8590;\">Kiếm $3 triệu trong cuộc sụp đổ. Từ $1,000 thành $200,000 tuổi 21</p>\n          \n        </div>\n      </div>\n      \n      <div class=\"flex gap-6 items-start rounded-xl px-7 py-6\" style=\"background: #e6edf304; border: 1px solid #ea580c20;\">\n        <div class=\"flex-shrink-0 w-[84px] h-[58px] rounded-xl flex items-center justify-center text-center font-bold\" style=\"background: #ea580c; color: white; font-size: 15px; line-height: 1.1;\">\n          1929\n        </div>\n        <div>\n          <h3 class=\"font-bold\" style=\"font-size: 25px; line-height: 1.25; color: #e6edf3;\">Livermore kinh điển</h3>\n          \n          <p class=\"mt-2\" style=\"font-size: 19px; line-height: 1.45; color: #7d8590;\">Kiếm $100 triệu trong Wall Street Crash. Vợ lo sợ mất đồ nhà 23 phòng</p>\n          \n        </div>\n      </div>\n      \n      <div class=\"flex gap-6 items-start rounded-xl px-7 py-6\" style=\"background: #e6edf304; border: 1px solid #ea580c20;\">\n        <div class=\"flex-shrink-0 w-[84px] h-[58px] rounded-xl flex items-center justify-center text-center font-bold\" style=\"background: #ea580c; color: white; font-size: 15px; line-height: 1.1;\">\n          1970\n        </div>\n        <div>\n          <h3 class=\"font-bold\" style=\"font-size: 25px; line-height: 1.25; color: #e6edf3;\">Richard Ney bestseller</h3>\n          \n          <p class=\"mt-2\" style=\"font-size: 19px; line-height: 1.45; color: #7d8590;\">'The Wall Street Jungle' tiết lộ thao túng specialists, NY Times bestseller</p>\n          \n        </div>\n      </div>\n      \n      <div class=\"flex gap-6 items-start rounded-xl px-7 py-6\" style=\"background: #e6edf304; border: 1px solid #ea580c20;\">\n        <div class=\"flex-shrink-0 w-[84px] h-[58px] rounded-xl flex items-center justify-center text-center font-bold\" style=\"background: #ea580c; color: white; font-size: 15px; line-height: 1.1;\">\n          1974\n        </div>\n        <div>\n          <h3 class=\"font-bold\" style=\"font-size: 25px; line-height: 1.25; color: #e6edf3;\">Ney tiếp tục</h3>\n          \n          <p class=\"mt-2\" style=\"font-size: 19px; line-height: 1.45; color: #7d8590;\">'The Wall Street Gang' và 'Making It In The Market' - champion của small investor</p>\n          \n        </div>\n      </div>\n      \n    </div>\n  </div>\n\n  \n  <div class=\"mt-4 px-8 py-4 rounded-xl\" style=\"background: #ea580c12; border: 1px solid #ea580c24;\">\n    <p class=\"font-semibold\" style=\"font-size: 21px; color: #ea580c;\">Phương pháp (method) của Wyckoff: Một thị trường chỉ làm 3 thứ - tích lũy, phân phối, hoặc đi theo xu hướng. Xác định giai đoạn hiện tại là khóa để giao dịch thành công.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 7}}, {"id": "s09", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0d1117;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">PHÂN TÍCH</span>\n  </div>\n  <div class=\"flex gap-6 flex-1 min-h-0\">\n    <div style=\"flex: 55; display: flex; flex-direction: column; min-height: 0;\">\n      <h2 class=\"font-display font-bold mb-10\ {"id": "s17", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0d1117;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">PHÂN TÍCH</span>\n  </div>\n  <div class=\"flex gap-6 flex-1 min-h-0\">\n    <div style=\"flex: 55; display: flex; flex-direction: column; min-height: 0;\">\n      <h2 class=\"font-display font-bold mb-10\" style=\"font-size: 44px; line-height: 1.15; color: #e6edf3;\">\n        Volume at Price (VAP) - Giới thiệu sớm\n      </h2>\n      <div class=\"flex-1 flex flex-col justify-center\">\n        <ul class=\"space-y-6\">\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              VPA nhìn quan hệ tuyến tính volume-giá bên NGOÀI nến. VAP nhìn profile volume bên TRONG nến\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              VAP cho thấy concentration mua/bán tại từng mức giá - như cắt mở volume bar\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Volume tập trung tại đáy = mua nhiều = support. Tại đỉnh = bán nhiều = resistance\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Hai góc nhìn bổ sung: VPA = bên ngoài, VAP = bên trong. Một tam giác dữ liệu đầy đủ\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #ea580c0D, #ea580c08); border: 1px solid #ea580c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #ea580c1A;\">\n      <span style=\"color: #ea580c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #ea580c;\">VAP sẽ được triển khai chi tiết ở Chương 9. Đây chỉ là giới thiệu sớm để hiểu bài bạc hơn.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 16}}, {"id": "s18", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0d1117;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">PHÂN TÍCH</span>\n  </div>\n  <div class=\"flex gap-6 flex-1 min-h-0\">\n    <div style=\"flex: 55; display: flex; flex-direction: column; min-height: 0;\">\n      <h2 class=\"font-display font-bold mb-10\" style=\"font-size: 44px; line-height: 1.15; color: #e6edf3;\">\n        6 nguyên tắc hướng dẫn của VPA\n      </h2>\n      <div class=\"flex-1 flex flex-col justify-center\">\n        <ul class=\"space-y-6\">\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              1. Nghệ thuật không phải khoa học: VPA chủ quan, không thể tự động hóa bằng phần mềm\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              2. Kiên nhẫn: Thị trường như tàu chong đầu, cần thời gian dọn dẹp. Đừng nhảy vào ngay\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              3. Tương đối: Volume chỉ có ý nghĩa khi so sánh với lịch sử trên cùng feed\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: # nd: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Sử dụng mọi phương tiện truyền thông để tạo SO: tin tức kinh tế, chính trị, thiên tai, báo cáo tài chính\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Tích lũy diễn ra trong nhiều ngày/tuần/tháng - không thể lấp đầy kho bằng một lần\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Giá dao động lên xuống nhiều lần: đẩy xuống để lấy hàng, nâng lên để người bán ít nghi ngờ\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Wyckoff: 'A large operator takes days, weeks or months in which to accumulate his line'\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n    <div style=\"flex: 45; display: flex; align-items: center; justify-content: center;\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; height: 100%;\">\n        <img src=\"assets/accumulation-schematic.svg\" alt=\"Sơ đồ tí ng = cảm xúc mạnh. Đơn giản và hiệu quả\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              4. Cùng một nến có ý nghĩa HOÀN TOÀN khác nhau tùy vị trí trong xu hướng (đỉnh vs đáy vs giữa)\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              5. Volume xác nhận giá: bắt đầu từ nến, rồi tìm xác nhận hoặc anomaly trong volume bar\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #ea580c0D, #ea580c08); border: 1px solid #ea580c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #ea580c1A;\">\n      <span style=\"color: #ea580c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #ea580c;\">5 nguyên tắc này áp dụng cho TẤT CẢ nến và mọi phân tích VPA. Đây là khung tham chiếu cơ bản.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 27}}, {"id": "s29", "layout": "timeline", "html": "<div class=\"w-full h-full flex flex-col px-24 py-16 relative overflow-hidden\" style=\"background: #0d1117;\">\n  <div class=\"flex items-center gap-4 mb-3\">\n    <div s \n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Thị trường chỉ đi 3 hướng: tăng, giảm, đi ngang. 70% thời gian đi ngang (congestion)\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Người mua tại đỉnh = YẾU (sợ mất đồng). Người mua tại đáy = MẠNH (chờ đợi, mua lúc về)\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Congestion tạo barrier vô hình: hàng người đầu tư mắc kẹt tại các mức giá này\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Mỗi lần giá quay lại, áp lực buying/selling cũ đẩy giá đi. Tương tự bành ping-pong\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Đây là nơi xu hướng được sinh ra hoặc tạm dừng. Là 'sàn đệ' quan trọng nhất\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n    <div style=\"flex: 45; display: flex; align-items: center; justify-content: center;\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; height: 100%;\">\n        <img src=\"assets/support-resistance.svg\" alt=\"Support và Resistance\" style=\"width: 100%; height: 100%; object-fit: contain; border-radius: 16px; background: #e6edf308; padding: 12px;\">\n        \n        <span style=\"font-size: 12px; color: #7d859088;\">S/R Diagram</span>\n        \n      </div>\n    </div>\n    \n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #ea580c0D, #ea580c08); border: 1px solid #ea580c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #ea580c1A;\">\n      <span style=\"color: #ea580c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #ea580c;\">Support/resistance không phải thép đai mà là đai cao su - co dãn dai, có hồi dạn. Phân tích kỹ thuật là nghệ thuật.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 33}}, {"id": "s35", "layout": "bullet", "html": "<div class=\"w-full h-full flex flex-col px-24 py-20 relative\" style=\"background: #0d1117;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">PHÂN TÍCH</span>\n  </div>\n  <div class=\"flex gap-6 flex-1 min-h-0\">\n    <div style=\"flex: 55; display: flex; flex-direction: column; min-height: 0;\">\n      <h2 class=\"font-display font-bold mb-10\" style=\"font-size: 44px; line-height: 1.15; color: #e6edf3;\">\n        Pivot và Breakout - Công cụ xác định congestion\n      </h2>\n      <div class=\"flex-1 flex flex-col justify-center\">\n        <ul class=\"space-y-6\">\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Pivot High: 3 nến, nến giữa có High cao hơn và Low cao hơn = suy yếu đầu tiên\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Pivot Low: 3 nến, nến giữa có Low thấp hơn và High thấp hơn = mạnh mẽ đầu tiên\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Congestion entrance: 1 pivot high + 1 pivot low = xác định trần (ceiling) và đáy (floor)\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Breakout hợp lệ: clear water qua trần/đáy + volume cao và tăng = di chuyển thật sự\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #ea580c; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e6edf3cc;\">\n              Breakout giả (fake out): vượt qua nhưng volume thấp = insiders đặt bẫy. Chỉ VPA trader biết\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #ea580c0D, #ea580c08); border: 1px solid #ea580c1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #ea580c1A;\">\n      <span style=\"color: #ea580c; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #ea580c;\">Pivot là 'vị trí GPS' của bạn trên biểu đồ. Breakout + volume = di chuyển thật. Breakout không volume = bẫy.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 34}}, {"id": "s36", "layout": "comparison", "html": "<div class=\"w-full h-full flex flex-col px-24 py-16 relative\" style=\"background: #0d1117;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #ea580c; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #ea580c; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">SO SÁNH</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-6\" sty     const initialParams = new URLSearchParams(window.location.search);
    if (initialParams.get('clean') === '1') document.body.classList.add('clean');
    const initialSlide = Number.parseInt(initialParams.get('slide') || '1', 10);
    let currentIndex = Number.isFinite(initialSlide) ? Math.min(Math.max(initialSlide - 1, 0), SLIDES.length - 1) : 0;

    function motionTargets(deck) {
      return deck.querySelectorAll([
        'h1', 'h2', 'h3',
        'p', 'li', 'table',
        '.chart-container',
        '.grid > *',
        '.space-y-3 > *',
        '.space-y-7 > *',
        '.inline-flex'
      ].join(','));
    }

    function applyMotion(deck, slide) {
      const motion = slide.motion || {};
      deck.classList.remove(
        'transition-fade', 'transition-rise', 'transition-push', 'transition-scale',
        'motion-quiet', 'motion-polished', 'motion-cinematic', 'motion-accent-sweep'
      );
      deck.classList.add(`transition-${motion.transition || 'rise'}`);
      deck.classList.add(`motion-${motion.intensity || 'polished'}`);
      if ((motion.effects || []).includes('accent-sweep') || ['hero', 'section', 'takeaway'].includes(slide.layout)) {
        deck.classList.add('motion-accent-sweep');
      }
      const targets = Array.from(motionTargets(deck)).filter((node) => {
        if (node.classList.contains('absolute')) return false;
        if (node.closest('.absolute')) return false;
        return true;
      });
      targets.forEach((node, idx) => {
        node.classList.add('motion-target');
        node.style.animationDelay = motion.reveal === 'none' ? '0ms' : `${Math.min(idx, 14) * 55}ms`;
      });
    }

    function renderSlide(index) {
      if (window._activeChart) {
        window._activeChart.dispose();
        window._activeChart = null;
      }
      const deck = document.getElementById('deck');
      deck.classList.add('is-changing');
      
      setTimeout(() => {
        deck.innerHTML = SLIDES[index].html;
        deck.dataset.slideIndex = index;
        applyMotion(deck, SLIDES[index]);
        deck.classList.remove('is-changing');
        
        setTimeout(() => {
          const chartDom = deck.querySelector('.chart-container');
          if (chartDom && SLIDES[index].chart) {
            const chart = echarts.init(chartDom);
            chart.setOption(SLIDES[index].chart);
            window._activeChart = chart;
          }
        }, 200);
        
        updateNav(index);
        updateProgress(index);
      }, 250);
    }

    function updateNav(idx) {
      const nav = document.getElementById('slide-nav');
      let dotsHtml = '<div class="dots">';
      SLIDES.forEach((_, i) => {
        dotsHtml += `<div class="dot ${i === idx ? 'active' : ''}" onclick="goTo(${i})"></div>`;
      });
      dotsHtml += '</div>';
      
      nav.innerHTML = `
        <button onclick="prev()">&#9664;</button>
        ${dotsHtml}
        <span class="counter">${idx + 1} / ${SLIDES.length}</span>
        <button onclick="next()">&#9654;</button>
      `;
    }

    function updateProgress(idx) {
      const pct = ((idx + 1) / SLIDES.length) * 100;
      document.getElementById('progress').style.width = pct + '%';
    }

    function syncUrl(index) {
      const url = new URL(window.location.href);
      url.searchParams.set('slide', String(index + 1));
      window.history.replaceState(null, '', url);
    }

    function next() {
      if (currentIndex < SLIDES.length - 1) { currentIndex++; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function prev() {
      if (currentIndex > 0) { currentIndex--; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function goTo(i) {
      currentIndex = Math.min(Math.max(i, 0), SLIDES.length - 1);
      syncUrl(currentIndex);
      renderSlide(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      if (e.key === 'Home') { goTo(0); }
      if (e.key === 'End') { goTo(SLIDES.length - 1); }
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    function scaleDeck() {
      const deck = document.getElementById('deck');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY) * (document.body.classList.contains('clean') ? 0.95 : 0.80);
      deck.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', scaleDeck);
    scaleDeck();
    syncUrl(currentIndex);
    renderSlide(currentIndex);
  </script>
