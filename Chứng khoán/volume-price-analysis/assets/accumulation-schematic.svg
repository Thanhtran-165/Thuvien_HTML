<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" fill="none">
  <rect width="520" height="300" rx="12" fill="#1a1f2e"/>
  <text x="260" y="28" text-anchor="middle" fill="#ea580c" font-family="Inter,sans-serif" font-size="15" font-weight="bold">Sơ Đồ Tích Lũy Wyckoff (Accumulation)</text>
  <line x1="40" y1="250" x2="480" y2="250" stroke="#2d333b" stroke-width="1"/>
  <text x="480" y="265" fill="#475569" font-family="Inter,sans-serif" font-size="9">Giá</text>
  <line x1="40" y1="250" x2="40" y2="50" stroke="#2d333b" stroke-width="1"/>
  <text x="25" y="50" fill="#475569" font-family="Inter,sans-serif" font-size="9">$</text>
  <path d="M50,100 Q70,200 90,210 Q110,220 130,190 Q150,160 170,210 Q190,260 210,220 Q230,180 250,200 Q270,220 290,180 Q310,140 330,160 Q350,180 370,140 Q390,100 410,130 Q430,160 450,90 Q460,60 470,70" fill="none" stroke="#ea580c" stroke-width="2"/>
  <line x1="50" y1="95" x2="250" y2="95" stroke="#16a34a" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="150" y="88" text-anchor="middle" fill="#16a34a" font-family="Inter,sans-serif" font-size="8" opacity="0.8">Resistance (Trần)</text>
  <line x1="90" y1="260" x2="250" y2="260" stroke="#dc2626" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="170" y="278" text-anchor="middle" fill="#dc2626" font-family="Inter,sans-serif" font-size="8" opacity="0.8">Support (Đáy)</text>
  <text x="80" y="40" fill="#f59e0b" font-family="Inter,sans-serif" font-size="9" font-weight="bold">PS</text>
  <text x="75" y="50" fill="#7d8590" font-family="Inter,sans-serif" font-size="7">Preliminary</text>
  <text x="75" y="58" fill="#7d8590" font-family="Inter,sans-serif" font-size="7">Support</text>
  <text x="160" y="278" fill="#dc2626" font-family="Inter,sans-serif" font-size="9" font-weight="bold">SC</text>
  <text x="100" y="168" fill="#ea580c" font-family="Inter,sans-serif" font-size="9" font-weight="bold">AR</text>
  <text x="100" y="178" fill="#7d8590" font-family="Inter,sans-serif" font-size="7">Automatic Rally</text>
  <text x="210" y="232" fill="#16a34a" font-family="Inter,sans-serif" font-size="9" font-weight="bold">ST</text>
  <text x="200" y="242" fill="#7d8590" font-family="Inter,sans-serif" font-size="7">Secondary Test</text>
  <rect x="280" y="120" width="140" height="100" rx="8" fill="#0d1117" stroke="#2d333b" stroke-width="1"/>
  <text x="350" y="140" text-anchor="middle" fill="#ea580c" font-family="Inter,sans-serif" font-size="10" font-weight="bold">Volume Đặc Điểm</text>
  <rect x="295" y="150" width="20" height="20" rx="2" fill="#ea580c" opacity="0.9"/>
  <text x="320" y="164" fill="#7d8590" font-family="Inter,sans-serif" font-size="8">SC = Volume cực cao</text>
  <rect x="295" y="175" width="20" height="10" rx="2" fill="#ea580c" opacity="0.4"/>
  <text x="320" y="184" fill="#7d8590" font-family="Inter,sans-serif" font-size="8">ST = Volume thấp ✓</text>
  <rect x="295" y="195" width="20" height="15" rx="2" fill="#16a34a" opacity="0.7"/>
  <text x="320" y="206" fill="#16a34a" font-family="Inter,sans-serif" font-size="8" font-weight="bold">Breakout = Volume cao</text>
  <text x="440" y="75" fill="#16a34a" font-family="Inter,sans-serif" font-size="10" font-weight="bold">↑ Breakout</text>
  <text x="260" y="295" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="9">PS → SC → AR → ST → Spring → Breakout = Mô hình tích lũy cổ điển</text>
</svg>