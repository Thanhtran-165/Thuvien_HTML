  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="32" fill="none" stroke="#f9a8d4" stroke-width="3"/>
  <g transform="translate(92 88)">
    <text x="0" y="0" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">Ung ho du an slide nghien cuu mo</text>
