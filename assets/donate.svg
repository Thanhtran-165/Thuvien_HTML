    <text x="48" y="246" fill="#6b7280" font-family="Inter, Arial, sans-serif" font-size="21">Ban co the thay file nay bang anh QR that tai:</text>
    <text x="48" y="280" fill="#111827" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20">assets/donate.png</text>
