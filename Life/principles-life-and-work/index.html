    .slide-container {

    .slide-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .slide-nav button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .slide-nav button:hover {
      background: rgba(255,255,255,0.15);
    }
    .slide-nav .counter {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      min-width: 60px;
      text-align: center;
    }
    .slide-nav .dots {
      display: flex;
      gap: 6px;
      margin: 0 8px;
    }
    .slide-nav .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.3s;
    }
    .slide-nav .dot.active {
      background: #2563eb;
      width: 24px;
      border-radius: 4px;
    }

    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: #2563eb;
      transition: width 0.4s ease;
      z-index: 10000;

    .motion-target {

    @keyframes chartLift {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }

ckground: #2563eb; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">4</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #111827dd;\">\n          Cởi mở triệt để: tìm người đáng tin nhất bất đồng với bạn\n        </span>\n      </div>\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #2563eb08; border: 1px solid #2563eb18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #2563eb; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">5</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #111827dd;\">\n          Hệ thống hóa nguyên tắc thành thuật toán — để cỗ máy làm việc cho bạn\n        </span>\n      </div>\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #2563eb08; border: 1px solid #2563eb18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #2563eb; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">6</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #111827dd;\">\n          Không làm theo nguyên tắc ai mù quáng — xây bộ sưu tập của riêng bạn\n        </span>\n      </div>\n      \n    </div>\n  </div>\n\n  \n  <div class=\"relative z-10 mt-8 px-8 py-5 flex items-start gap-4\" style=\"background: #2563eb; color: white; border-radius: 14px; box-shadow: 0 14px 35px #2563eb33;\">\n    <span class=\"flex-shrink-0\" style=\"font-size: 24px; line-height: 1.35;\">&#9733;</span>\n    <p class=\"font-bold\" style=\"font-size: 24px; line-height: 1.35;\">Thông điệp cuối cùng: Dalio không muốn bạn theo ngu     const initialParams = new URLSearchParams(window.location.search);
    if (initialParams.get('clean') === '1') document.body.classList.add('clean');
    const initialSlide = Number.parseInt(initialParams.get('slide') || '1', 10);
    let currentIndex = Number.isFinite(initialSlide) ? Math.min(Math.max(initialSlide - 1, 0), SLIDES.length - 1) : 0;

    function motionTargets(deck) {
      return deck.querySelectorAll([
        'h1', 'h2', 'h3',
        'p', 'li', 'table',
        '.chart-container',
        '.grid > *',
        '.space-y-3 > *',
        '.space-y-7 > *',
        '.inline-flex'
      ].join(','));
    }

    function applyMotion(deck, slide) {
      const motion = slide.motion || {};
      deck.classList.remove(
        'transition-fade', 'transition-rise', 'transition-push', 'transition-scale',
        'motion-quiet', 'motion-polished', 'motion-cinematic', 'motion-accent-sweep'
      );
      deck.classList.add(`transition-${motion.transition || 'rise'}`);
      deck.classList.add(`motion-${motion.intensity || 'polished'}`);
      if ((motion.effects || []).includes('accent-sweep') || ['hero', 'section', 'takeaway'].includes(slide.layout)) {
        deck.classList.add('motion-accent-sweep');
      }
      const targets = Array.from(motionTargets(deck)).filter((node) => {
        if (node.classList.contains('absolute')) return false;
        if (node.closest('.absolute')) return false;
        return true;
      });
      targets.forEach((node, idx) => {
        node.classList.add('motion-target');
        node.style.animationDelay = motion.reveal === 'none' ? '0ms' : `${Math.min(idx, 14) * 55}ms`;
      });
    }

    function renderSlide(index) {
      if (window._activeChart) {
        window._activeChart.dispose();
        window._activeChart = null;
      }
      const deck = document.getElementById('deck');
      deck.classList.add('is-changing');
      
      setTimeout(() => {
        deck.innerHTML = SLIDES[index].html;
        deck.dataset.slideIndex = index;
        applyMotion(deck, SLIDES[index]);
        deck.classList.remove('is-changing');
        
        setTimeout(() => {
          const chartDom = deck.querySelector('.chart-container');
          if (chartDom && SLIDES[index].chart) {
            const chart = echarts.init(chartDom);
            chart.setOption(SLIDES[index].chart);
            window._activeChart = chart;
          }
        }, 200);
        
        updateNav(index);
        updateProgress(index);
      }, 250);
    }

    function updateNav(idx) {
      const nav = document.getElementById('slide-nav');
      let dotsHtml = '<div class="dots">';
      SLIDES.forEach((_, i) => {
        dotsHtml += `<div class="dot ${i === idx ? 'active' : ''}" onclick="goTo(${i})"></div>`;
      });
      dotsHtml += '</div>';
      
      nav.innerHTML = `
        <button onclick="prev()">&#9664;</button>
        ${dotsHtml}
        <span class="counter">${idx + 1} / ${SLIDES.length}</span>
        <button onclick="next()">&#9654;</button>
      `;
    }

    function updateProgress(idx) {
      const pct = ((idx + 1) / SLIDES.length) * 100;
      document.getElementById('progress').style.width = pct + '%';
    }

    function syncUrl(index) {
      const url = new URL(window.location.href);
      url.searchParams.set('slide', String(index + 1));
      window.history.replaceState(null, '', url);
    }

    function next() {
      if (currentIndex < SLIDES.length - 1) { currentIndex++; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function prev() {
      if (currentIndex > 0) { currentIndex--; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function goTo(i) {
      currentIndex = Math.min(Math.max(i, 0), SLIDES.length - 1);
      syncUrl(currentIndex);
      renderSlide(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      if (e.key === 'Home') { goTo(0); }
      if (e.key === 'End') { goTo(SLIDES.length - 1); }
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    function scaleDeck() {
      const deck = document.getElementById('deck');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY) * (document.body.classList.contains('clean') ? 0.95 : 0.80);
      deck.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', scaleDeck);
    scaleDeck();
    syncUrl(currentIndex);
    renderSlide(currentIndex);
  </script>
