ercase\" style=\"color: #7c3aed;\">CHỈ SỐ TRỌNG TÂM</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-8\" style=\"font-size: 46px; line-height: 1.12; color: #e7e9ea;\">\n    Bollinger Bands: Band hẹp = sắp breakout, Band rộng = high volatility\n  </h2>\n  \n\n  <div class=\"grid grid-cols-3 gap-6 flex-1 content-center\">\n    \n    <div class=\"min-h-[210px] rounded-xl px-8 py-7 flex flex-col justify-between\" style=\"background: linear-gradient(180deg, #7c3aed10, #e7e9ea04); border: 1px solid #7c3aed24;\">\n      <p class=\"font-semibold uppercase\" style=\"font-size: 15px; line-height: 1.35; color: #71767b; letter-spacing: 0.08em;\">Middle Band</p>\n      <div class=\"my-4\">\n        <p class=\"font-display font-black\" style=\"font-size: 54px; line-height: 0.98; color: #e7e9ea;\">20-day EMA = baseline. Upper Band: +2 standard deviations. Lower Band: -2 standard deviations</p>\n      </div>\n      \n    </div>\n    \n    <div class=\"min-h-[210px] rounded-xl px-8 py-7 flex flex-col justify-between\" style=\"background: linear-gradient(180deg, #7c3aed10, #e7e9ea04); border: 1px solid #7c3aed24;\">\n      <p class=\"font-semibold uppercase\" style=\"font-size: 15px; line-height: 1.35; color: #71767b; letter-spacing: 0.08em;\">Band narrowing (squeeze) = low volatility → sắp có movement lớn. Band widening = volatility tăng</p>\n      <div class=\"my-4\">\n        <p class=\"font-display font-black\" style=\"font-size: 54px; line-height: 0.98; color: #e7e9ea;\"></p>\n      </div>\n      \n    </div>\n    \n    <div class=\"min-h-[210px] rounded-xl px-8 py-7 flex flex-col justify-between\" style=\"background: linear-gradient(180deg, #7c3aed10, #e7e9ea04); border: 1px solid #7c3aed24;\">\n      <p class=\"font-semibold uppercase\" style=\"font-size: 15px; line-height: 1.35; color: #71767b; letter-spacing: 0.08em;\">Price exceeding bands = extreme condition</p>\n      <div class=\"my-4\">\n        <p class=\"font-display font-black\" style=\"font-size: 54px; line á), Convergence (2 MA gặp nhau), Divergence (2 MA tách xa)\n            </span>\n          </li>\n          \n        </ul>\n      </div>\n    </div>\n    \n  </div>\n  \n  <div class=\"mt-8 px-8 py-5 rounded-2xl flex items-center gap-4\" style=\"background: linear-gradient(135deg, #7c3aed0D, #7c3aed08); border: 1px solid #7c3aed1A;\">\n    <div class=\"flex-shrink-0 flex items-center justify-center rounded-xl\" style=\"width: 40px; height: 40px; background: #7c3aed1A;\">\n      <span style=\"color: #7c3aed; font-size: 20px;\">&#9733;</span>\n    </div>\n    <p class=\"font-semibold\" style=\"font-size: 20px; color: #7c3aed;\">MA dài hạn ít biến động nhưng data cũ có thể sai lệch trend hiện tại. Giải pháp: kết hợp 2 MA + weighting.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "push", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 31}}, {"id": "s33", "layout": "comparison", "html": "<div class=\"w-full h-full flex flex-col px-24 py-16 relative\" style=\"background: #0f1419;\">\n  <div class=\"absolute top-0 right-0 w-[300px] h-[300px] rounded-full opacity-[0.04]\" style=\"background: #7c3aed; transform: translate(40%, -40%);\"></div>\n  \n  <div class=\"flex items-center gap-4 mb-3\">\n    <div style=\"width: 48px; height: 4px; background: #7c3aed; border-radius: 2px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #7c3aed;\">SO SÁNH</span>\n  </div>\n  <h2 class=\"font-display font-bold mb-6\" style=\"font-size: 42px; line-height: 1.15; color: #e7e9ea;\">\n    Exponential MA phổ biến nhất vì kết hợp ổn định và phản hồi nhanh\n  </h2>\n  \n  <div class=\"flex-1 flex gap-8\">\n  \n    <div class=\"flex-1 flex flex-col rounded-2xl px-10 py-8 overflow-auto\" style=\"background: linear-gradient(180deg, #7c3aed08, #7c3aed03); border: 1.5px solid #7c3aed20;\">\n      <div class=\"flex items-center gap-3 mb-6\">\n        <div class=\"flex-shrink-0\" style=\"width: 12px; ing: 0.08em;\">MACD = 12-day EMA − 26-day EMA. Signal line = 9-day EMA của MACD. Best Buy</p>\n      <div class=\"my-4\">\n        <p class=\"font-display font-black\" style=\"font-size: 54px; line-height: 0.98; color: #e7e9ea;\">MACD cross signal line trước price turn</p>\n      </div>\n      \n    </div>\n    \n    <div class=\"min-h-[210px] rounded-xl px-8 py-7 flex flex-col justify-between\" style=\"background: linear-gradient(180deg, #7c3aed10, #e7e9ea04); border: 1px solid #7c3aed24;\">\n      <p class=\"font-semibold uppercase\" style=\"font-size: 15px; line-height: 1.35; color: #71767b; letter-spacing: 0.08em;\">3 MAs in play</p>\n      <div class=\"my-4\">\n        <p class=\"font-display font-black\" style=\"font-size: 54px; line-height: 0.98; color: #e7e9ea;\">12-day (short), 26-day (long), 9-day (signal). MACD > 0 = bullish, MACD < 0 = bearish</p>\n      </div>\n      \n    </div>\n    \n    <div class=\"min-h-[210px] rounded-xl px-8 py-7 flex flex-col justify-between\" style=\"background: linear-gradient(180deg, #7c3aed10, #e7e9ea04); border: 1px solid #7c3aed24;\">\n      <p class=\"font-semibold uppercase\" style=\"font-size: 15px; line-height: 1.35; color: #71767b; letter-spacing: 0.08em;\">Divergence giữa MACD và price = momentum shift. MACD rising + price falling = bullish divergence</p>\n      <div class=\"my-4\">\n        <p class=\"font-display font-black\" style=\"font-size: 54px; line-height: 0.98; color: #e7e9ea;\"></p>\n      </div>\n      \n    </div>\n    \n    <div class=\"min-h-[210px] rounded-xl px-8 py-7 flex flex-col justify-between\" style=\"background: linear-gradient(180deg, #7c3aed10, #e7e9ea04); border: 1px solid #7c3aed24;\">\n      <p class=\"font-semibold uppercase\" style=\"font-size: 15px; line-height: 1.35; color: #71767b; letter-spacing: 0.08em;\">MACD histogram</p>\n      <div class=\"my-4\">\n        <p class=\"font-display font-black\" style=\"font-size: 54px; line-height: 0.98; color: #e7e9ea;\">bars above zero = bulli ught suốt uptrend = extreme không phải sell signal\n      </h2>\n      <div class=\"flex-1 flex flex-col justify-center\">\n        <ul class=\"space-y-6\">\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #7c3aed; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e7e9eacc;\">\n              Centered (MACD): zero line = mốc. Trên 0 = bullish. Dưới 0 = bearish. Đo trend strength và direction\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #7c3aed; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e7e9eacc;\">\n              Banded (RSI, Stochastics): 0-100 scale. RSI: 70/30. Stochastics: 80/20. Đo overbought/oversold levels\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #7c3aed; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e7e9eacc;\">\n              Sherwin Williams: RSI overbought throughout ENTIRE uptrend — extreme không = reversal chắc chắn\n            </span>\n          </li>\n          \n          <li class=\"flex items-start gap-4 group\">\n            <div class=\"mt-2.5 flex-shrink-0\" style=\"width: 10px; height: 10px; background: #7c3aed; border-radius: 3px; transform: rotate(45deg);\"></div>\n            <span style=\"font-size: 24px; line-height: 1.5; color: #e7e9eacc;\">\n              Momentum chậm: giá có thể sideways rồi tiếp tục, consolidate rồi reverse, hoặc reverse tại R/S\n            </span>\n          </l     const initialParams = new URLSearchParams(window.location.search);
    if (initialParams.get('clean') === '1') document.body.classList.add('clean');
    const initialSlide = Number.parseInt(initialParams.get('slide') || '1', 10);
    let currentIndex = Number.isFinite(initialSlide) ? Math.min(Math.max(initialSlide - 1, 0), SLIDES.length - 1) : 0;

    function motionTargets(deck) {
      return deck.querySelectorAll([
        'h1', 'h2', 'h3',
        'p', 'li', 'table',
        '.chart-container',
        '.grid > *',
        '.space-y-3 > *',
        '.space-y-7 > *',
        '.inline-flex'

    }

    function applyMotion(deck, slide) {
      const motion = slide.motion || {};
      deck.classList.remove(
        'transition-fade', 'transition-rise', 'transition-push', 'transition-scale',
        'motion-quiet', 'motion-polished', 'motion-cinematic', 'motion-accent-sweep'
      );
      deck.classList.add(`transition-${motion.transition || 'rise'}`);
      deck.classList.add(`motion-${motion.intensity || 'polished'}`);
      if ((motion.effects || []).includes('accent-sweep') || ['hero', 'section', 'takeaway'].includes(slide.layout)) {
        deck.classList.add('motion-accent-sweep');
      }
      const targets = Array.from(motionTargets(deck)).filter((node) => {
        if (node.classList.contains('absolute')) return false;
        if (node.closest('.absolute')) return false;
        return true;
      });
      targets.forEach((node, idx) => {
        node.classList.add('motion-target');
        node.style.animationDelay = motion.reveal === 'none' ? '0ms' : `${Math.min(idx, 14) * 55}ms`;
      });
    }

    function renderSlide(index) {
      if (window._activeChart) {
        window._activeChart.dispose();
        window._activeChart = null;

      const deck = document.getElementById('deck');
      deck.classList.add('is-changing');
      
      setTimeout(() => {
        deck.innerHTML = SLIDES[index].html;
        deck.dataset.slideIndex = index;
        applyMotion(deck, SLIDES[index]);
        deck.classList.remove('is-changing');
        
        setTimeout(() => {
          const chartDom = deck.querySelector('.chart-container');
          if (chartDom && SLIDES[index].chart) {
            const chart = echarts.init(chartDom);
            chart.setOption(SLIDES[index].chart);
            window._activeChart = chart;
          }
        }, 200);
        
        updateNav(index);
        updateProgress(index);
      }, 250);
    }

    function updateNav(idx) {
      const nav = document.getElementById('slide-nav');
      let dotsHtml = '<div class="dots">';
      SLIDES.forEach((_, i) => {
        dotsHtml += `<div class="dot ${i === idx ? 'active' : ''}" onclick="goTo(${i})"></div>`;
      });
      dotsHtml += '</div>';
      
      nav.innerHTML = `

        ${dotsHtml}

    }

    function updateProgress(idx) {

      const url = new URL(window.location.href);
      url.searchParams.set('slide', String(index + 1));
      window.history.replaceState(null, '', url);
    }

    }
    function prev() {
      if (currentIndex > 0) { currentIndex--; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function goTo(i) {
      currentIndex = Math.min(Math.max(i, 0), SLIDES.length - 1);

      renderSlide(currentIndex);
