n": "fade", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 90}}, {"id": "slide-92", "layout": "takeaway", "html": "<div class=\"w-full h-full flex flex-col px-24 py-16 relative overflow-hidden\" style=\"background: #0f1117;\">\n  <div class=\"absolute inset-x-0 top-0 h-3\" style=\"background: #ea580c;\"></div>\n\n  <div class=\"relative z-10 flex items-center gap-4 mb-10\">\n    <div style=\"width: 56px; height: 5px; background: #ea580c; border-radius: 3px;\"></div>\n    <span class=\"text-xs font-semibold tracking-widest uppercase\" style=\"color: #ea580c;\">KẾT LUẬN</span>\n  </div>\n\n  <div class=\"relative z-10 max-w-6xl\">\n    <h2 class=\"font-display font-bold mb-10\" style=\"font-size: 56px; line-height: 1.12; color: #f1f5f9;\">\n      Ba hành động từ kiến thức volume\n    </h2>\n    <div class=\"space-y-3\">\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #ea580c08; border: 1px solid #ea580c18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #ea580c; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">1</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #f1f5f9dd;\">\n          Không bao giờ chỉ nhìn giá — luôn kiểm tra volume có xác nhận xu hướng không\n        </span>\n      </div>\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #ea580c08; border: 1px solid #ea580c18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #ea580c; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">2</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #f1f5f9dd;\">\n          Áp dụng VPCI như bộ lọc: chỉ giao dịch khi volume xác nhận hướng giá\n        </span>\n      </div>\n      \n      <div class=\"flex items-start gap-5 px-7 py-4\" style=\"background: #ea580c08; border: 1px solid #ea580c18; border-radius: 14px;\">\n        <div class=\"flex-shrink-0 flex items-center justify-center\" style=\"width: 40px; height: 40px; background: #ea580c; border-radius: 10px;\">\n          <span class=\"font-bold\" style=\"font-size: 20px; color: white;\">3</span>\n        </div>\n        <span class=\"text-left\" style=\"font-size: 26px; line-height: 1.45; color: #f1f5f9dd;\">\n          Khi VPCI mâu thuẫn giá — đó là cảnh báo đảo chiều sớm nhất, giảm rủi ro ngay\n        </span>\n      </div>\n      \n    </div>\n  </div>\n\n  \n  <div class=\"relative z-10 mt-8 px-8 py-5 flex items-start gap-4\" style=\"background: #ea580c; color: white; border-radius: 14px; box-shadow: 0 14px 35px #ea580c33;\">\n    <span class=\"flex-shrink-0\" style=\"font-size: 24px; line-height: 1.35;\">&#9733;</span>\n    <p class=\"font-bold\" style=\"font-size: 24px; line-height: 1.35;\">VPCI biến volume từ khái niệm trừu tượng thành công cụ ra quyết định cụ thể — với số liệu chứng minh.</p>\n  </div>\n  \n</div>", "chart": null, "motion": {"transition": "scale", "reveal": "stagger", "intensity": "polished", "effects": ["accent-sweep"], "order": 91}}];
    const initialParams = new URLSearchParams(window.location.search);
    if (initialParams.get('clean') === '1') document.body.classList.add('clean');
    const initialSlide = Number.parseInt(initialParams.get('slide') || '1', 10);
    let currentIndex = Number.isFinite(initialSlide) ? Math.min(Math.max(initialSlide - 1, 0), SLIDES.length - 1) : 0;

    function motionTargets(deck) {
      return deck.querySelectorAll([
        'h1', 'h2', 'h3',
        'p', 'li', 'table',
        '.chart-container',
        '.grid > *',
        '.space-y-3 > *',
        '.space-y-7 > *',
        '.inline-flex'
      ].join(','));
    }

    function applyMotion(deck, slide) {
      const motion = slide.motion || {};
      deck.classList.remove(
        'transition-fade', 'transition-rise', 'transition-push', 'transition-scale',
        'motion-quiet', 'motion-polished', 'motion-cinematic', 'motion-accent-sweep'
      );
      deck.classList.add(`transition-${motion.transition || 'rise'}`);
      deck.classList.add(`motion-${motion.intensity || 'polished'}`);
      if ((motion.effects || []).includes('accent-sweep') || ['hero', 'section', 'takeaway'].includes(slide.layout)) {
        deck.classList.add('motion-accent-sweep');
      }
      const targets = Array.from(motionTargets(deck)).filter((node) => {
        if (node.classList.contains('absolute')) return false;
        if (node.closest('.absolute')) return false;
        return true;
      });
      targets.forEach((node, idx) => {
        node.classList.add('motion-target');
        node.style.animationDelay = motion.reveal === 'none' ? '0ms' : `${Math.min(idx, 14) * 55}ms`;
      });
    }

    function renderSlide(index) {
      if (window._activeChart) {
        window._activeChart.dispose();
        window._activeChart = null;
      }
      const deck = document.getElementById('deck');
      deck.classList.add('is-changing');
      
      setTimeout(() => {
        deck.innerHTML = SLIDES[index].html;
        deck.dataset.slideIndex = index;
        applyMotion(deck, SLIDES[index]);
        deck.classList.remove('is-changing');
        
        setTimeout(() => {
          const chartDom = deck.querySelector('.chart-container');
          if (chartDom && SLIDES[index].chart) {
            const chart = echarts.init(chartDom);
            chart.setOption(SLIDES[index].chart);
            window._activeChart = chart;
          }
        }, 200);
        
        updateNav(index);
        updateProgress(index);
      }, 250);
    }

    function updateNav(idx) {
      const nav = document.getElementById('slide-nav');
      let dotsHtml = '<div class="dots">';
      SLIDES.forEach((_, i) => {
        dotsHtml += `<div class="dot ${i === idx ? 'active' : ''}" onclick="goTo(${i})"></div>`;
      });
      dotsHtml += '</div>';
      
      nav.innerHTML = `
        <button onclick="prev()">&#9664;</button>
        ${dotsHtml}
        <span class="counter">${idx + 1} / ${SLIDES.length}</span>
        <button onclick="next()">&#9654;</button>
      `;
    }

    function updateProgress(idx) {
      const pct = ((idx + 1) / SLIDES.length) * 100;
      document.getElementById('progress').style.width = pct + '%';
    }

    function syncUrl(index) {
      const url = new URL(window.location.href);
      url.searchParams.set('slide', String(index + 1));
      window.history.replaceState(null, '', url);
    }

    function next() {
      if (currentIndex < SLIDES.length - 1) { currentIndex++; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function prev() {
      if (currentIndex > 0) { currentIndex--; syncUrl(currentIndex); renderSlide(currentIndex); }
    }
    function goTo(i) {
      currentIndex = Math.min(Math.max(i, 0), SLIDES.length - 1);
      syncUrl(currentIndex);
      renderSlide(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      if (e.key === 'Home') { goTo(0); }
      if (e.key === 'End') { goTo(SLIDES.length - 1); }
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    function scaleDeck() {
      const deck = document.getElementById('deck');
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY) * (document.body.classList.contains('clean') ? 0.95 : 0.80);
      deck.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', scaleDeck);
    scaleDeck();
    syncUrl(currentIndex);
    renderSlide(currentIndex);
  </script>
